services:
  gagma:
    build: .
    container_name: gagma-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - gagma-data:/app/data        # Persistent DB + uploads
      - ./.env:/app/.env:ro         # Environment variables
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8001/health'); assert r.status_code==200"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: gagma-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gagma

volumes:
  gagma-data:
  caddy-data:
  caddy-config:
